<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical Marks Analyzer - IT25115</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        input {
            transition: 0.2s;
        }

        input:focus {
            transform: scale(1.01);
        }

        #resultBox {
            display: none;
        }

        #resultBox.show {
            display: block;
        }
    </style>
</head>


<body class="min-h-screen bg-gradient-to-r from-cyan-50 via-blue-50 to-violet-100 py-5 px-6">


    <!-- Student Proof -->
    <div class="max-w-3xl mx-auto mb-4">

        <div class="bg-blue-950 text-white rounded-xl px-5 py-3
                    flex justify-between items-center shadow-lg">

            <div>
                <p class="text-xs text-blue-200">
                    Practical Submission
                </p>

                <h2 class="text-lg font-bold">
                    IT25115 - Umesh Deshmukh
                </h2>
            </div>

            <div class="text-2xl">
                💻
            </div>

        </div>

    </div>


    <!-- Main Card -->
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">


        <!-- Title -->
        <div class="bg-gradient-to-r from-blue-700 to-violet-700
                    text-white px-7 py-5">

            <div class="flex items-center gap-3">

                <div class="bg-white/20 rounded-lg p-2 text-2xl">
                    📊
                </div>

                <div>

                    <h1 class="text-2xl font-bold">
                        Practical Marks Analyzer
                    </h1>

                    <p class="text-blue-100 text-sm mt-1">
                        Enter marks and calculate your academic performance
                    </p>

                </div>

            </div>

        </div>


        <!-- Form Area -->
        <div class="p-7">


            <div class="grid grid-cols-3 gap-4 mb-5">


                <!-- Practical 1 -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Practical 1
                    </label>

                    <input
                        type="number"
                        id="mark1"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                        class="w-full border-2 border-gray-200 rounded-lg
                               px-3 py-2.5 outline-none
                               focus:border-blue-500"
                    >

                </div>


                <!-- Practical 2 -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Practical 2
                    </label>

                    <input
                        type="number"
                        id="mark2"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                        class="w-full border-2 border-gray-200 rounded-lg
                               px-3 py-2.5 outline-none
                               focus:border-blue-500"
                    >

                </div>


                <!-- Viva -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Viva
                    </label>

                    <input
                        type="number"
                        id="mark3"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                        class="w-full border-2 border-gray-200 rounded-lg
                               px-3 py-2.5 outline-none
                               focus:border-blue-500"
                    >

                </div>

            </div>


            <!-- Calculate Button -->
            <button
                onclick="calculateMarks()"
                class="w-full bg-blue-600 hover:bg-blue-700
                       text-white font-bold py-3 rounded-lg
                       shadow-md transition duration-200"
            >
                Calculate My Result
            </button>


            <!-- Result -->
            <div id="resultBox"
                 class="mt-6 bg-blue-50 border border-blue-100 rounded-xl p-5">


                <div class="flex justify-between items-center mb-4">

                    <h2 class="text-xl font-bold text-gray-800">
                        Performance Summary
                    </h2>

                    <span class="text-2xl">
                        🏆
                    </span>

                </div>


                <!-- Result Grid -->
                <div class="grid grid-cols-3 gap-3">


                    <!-- Total -->
                    <div class="bg-white rounded-lg p-4 text-center shadow-sm">

                        <p class="text-xs text-gray-500 mb-1">
                            TOTAL
                        </p>

                        <p class="text-xl font-bold text-blue-700">
                            <span id="totalMarks"></span>
                            <span class="text-sm text-gray-400">
                                / 300
                            </span>
                        </p>

                    </div>


                    <!-- Percentage -->
                    <div class="bg-white rounded-lg p-4 text-center shadow-sm">

                        <p class="text-xs text-gray-500 mb-1">
                            PERCENTAGE
                        </p>

                        <p class="text-xl font-bold text-violet-700">
                            <span id="percent"></span>%
                        </p>

                    </div>


                    <!-- Grade -->
                    <div class="bg-white rounded-lg p-4 text-center shadow-sm">

                        <p class="text-xs text-gray-500 mb-1">
                            GRADE
                        </p>

                        <p id="grade"
                           class="text-lg font-bold text-green-600">
                        </p>

                    </div>

                </div>


                <!-- Message -->
                <p id="message"
                   class="text-center text-sm text-gray-600 mt-4">
                </p>

            </div>

        </div>


        <!-- Footer -->
        <div class="bg-gray-50 text-center py-3
                    text-xs text-gray-400 border-t">

            Practical Evaluation System • 2026

        </div>

    </div>


    <script>

        function calculateMarks() {

            // Get values
            let p1 = parseFloat(document.getElementById("mark1").value);
            let p2 = parseFloat(document.getElementById("mark2").value);
            let p3 = parseFloat(document.getElementById("mark3").value);


            // Validate marks
            if (
                isNaN(p1) || isNaN(p2) || isNaN(p3) ||
                p1 < 0 || p1 > 100 ||
                p2 < 0 || p2 > 100 ||
                p3 < 0 || p3 > 100
            ) {

                alert("Please enter marks between 0 and 100.");

                return;
            }


            // Calculate total
            let total = p1 + p2 + p3;

            // Calculate percentage
            let percentage = (total / 300) * 100;


            // Decide grade
            let grade;
            let message;


            if (percentage >= 90) {

                grade = "A+";
                message = "Outstanding performance!";

            }
            else if (percentage >= 80) {

                grade = "A";
                message = "Excellent performance!";

            }
            else if (percentage >= 70) {

                grade = "B";
                message = "Good performance!";

            }
            else if (percentage >= 60) {

                grade = "C";
                message = "Satisfactory performance.";

            }
            else {

                grade = "F";
                message = "More practice is required.";

            }


            // Show result
            document.getElementById("totalMarks").textContent =
                total;

            document.getElementById("percent").textContent =
                percentage.toFixed(2);

            document.getElementById("grade").textContent =
                grade;

            document.getElementById("message").textContent =
                message;


            document.getElementById("resultBox")
                .classList.add("show");

        }

    </script>

</body>

</html>
