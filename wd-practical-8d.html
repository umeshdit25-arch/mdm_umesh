<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT25115 - Umesh Deshmukh Student Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #dbeafe, #f0f9ff);
            font-family: Arial, sans-serif;
        }

        .registration-box {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #dbeafe;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .input-field {
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        .register-btn {
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.25);
        }
    </style>

    <script>
        function checkRegistration() {

            let studentName = document.getElementById("studentName").value.trim();
            let studentEmail = document.getElementById("studentEmail").value.trim();
            let userPassword = document.getElementById("userPassword").value;
            let phoneNumber = document.getElementById("phoneNumber").value.trim();

            // Check empty fields
            if (
                studentName === "" ||
                studentEmail === "" ||
                userPassword === "" ||
                phoneNumber === ""
            ) {
                alert("Please fill in all the required details.");
                return false;
            }

            // Email check
            let validEmail = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!validEmail.test(studentEmail)) {
                alert("Please enter a correct email address.");
                return false;
            }

            // Password check
            if (userPassword.length < 6) {
                alert("Password should contain at least 6 characters.");
                return false;
            }

            // Mobile number check
            let validMobile = /^[0-9]{10}$/;

            if (!validMobile.test(phoneNumber)) {
                alert("Mobile number must contain exactly 10 digits.");
                return false;
            }

            alert("Student registration completed successfully!");
            return true;
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-5">

    <div class="registration-box w-full max-w-lg rounded-2xl p-8">

        <div class="text-center mb-8">
            <div class="inline-block bg-blue-100 text-blue-700 px-4 py-2 rounded-full text-sm font-semibold mb-3">
                STUDENT PORTAL
            </div>

            <h1 class="text-3xl font-bold text-gray-800">
                Create Your Account
            </h1>

            <p class="text-gray-500 mt-2">
                Enter your details to complete registration
            </p>
        </div>

        <form onsubmit="return checkRegistration()">

            <div class="mb-5">
                <label for="studentName"
                       class="block text-gray-700 font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl"
                    placeholder="Enter full name">
            </div>

            <div class="mb-5">
                <label for="studentEmail"
                       class="block text-gray-700 font-semibold mb-2">
                    Email Address
                </label>

                <input
                    type="text"
                    id="studentEmail"
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl"
                    placeholder="example@gmail.com">
            </div>

            <div class="mb-5">
                <label for="userPassword"
                       class="block text-gray-700 font-semibold mb-2">
                    Create Password
                </label>

                <input
                    type="password"
                    id="userPassword"
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl"
                    placeholder="Minimum 6 characters">
            </div>

            <div class="mb-7">
                <label for="phoneNumber"
                       class="block text-gray-700 font-semibold mb-2">
                    Contact Number
                </label>

                <input
                    type="text"
                    id="phoneNumber"
                    class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl"
                    placeholder="Enter 10 digit number">
            </div>

            <button
                type="submit"
                class="register-btn w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl">
                Create Account
            </button>

        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            © 2026 Student Registration Portal
        </p>

    </div>

</body>
</html>
