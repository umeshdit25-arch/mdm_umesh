<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT25115 - Umesh Deshmukh</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            if (name == "" || email == "" || password == "" || mobile == "") {
                alert("All fields are mandatory!");
                return false;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
            if (!email.match(emailPattern)) {
                alert("Enter a valid email address!");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters!");
                return false;
            }

            let mobilePattern = /^[0-9]{10}$/;
            if (!mobile.match(mobilePattern)) {
                alert("Enter a valid 10-digit mobile number!");
                return false;
            }

            alert("Registration Successful!");
            document.querySelector("form").reset();
            return true;
        }
    </script>
</head>

<body class="bg-gradient-to-r from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl border border-gray-200">

        <h2 class="text-3xl font-extrabold text-center text-indigo-700 mb-8">
            Student Registration
        </h2>

        <form onsubmit="return validateForm()" class="space-y-6">

            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">
                    Name
                </label>
                <input type="text" id="name"
                    class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Enter your name">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    Email
                </label>
                <input type="text" id="email"
                    class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Enter your email">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>
                <input type="password" id="password"
                    class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Enter password">
            </div>

            <div>
                <label for="mobile" class="block text-sm font-semibold text-gray-700 mb-2">
                    Mobile Number
                </label>
                <input type="text" id="mobile"
                    class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Enter 10-digit mobile number">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold p-3 rounded-lg shadow-md hover:from-indigo-700 hover:to-purple-700 transition duration-300">
                Register
            </button>

        </form>

    </div>

</body>
</html>
